<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Trial</title>

<style>
/* 🔹 Base (Mobile First) */
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

.header {
  background: #333;
  color: white;
  padding: 15px;
  text-align: center;
}

.nav {
  display: flex;
  flex-direction: column;
  background: #555;
}

.nav a {
  color: white;
  padding: 10px;
  text-decoration: none;
  text-align: center;
}

.nav a:hover {
  background: #777;
}

.container {
  display: flex;
  flex-direction: column;
  padding: 10px;
}

.box {
  background: lightblue;
  margin: 10px 0;
  padding: 20px;
  text-align: center;
}

/* 🔹 Tablet */
@media (min-width: 768px) {
  .nav {
    flex-direction: row;
    justify-content: space-around;
  }

  .container {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .box {
    flex: 1 1 45%;
    margin: 10px;
  }
}

/* 🔹 Desktop */
@media (min-width: 1024px) {
  .box {
    flex: 1 1 22%;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>My Responsive Website</h1>
</div>

<div class="nav">
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</div>

<div class="container">
  <div class="box">Box 1</div>
  <div class="box">Box 2</div>
  <div class="box">Box 3</div>
  <div class="box">Box 4</div>
</div>

</body>
</html>
