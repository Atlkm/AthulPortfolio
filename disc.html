<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rotating Circle Slider</title>

<style>
body{
  font-family: Arial;
  padding:40px;
}

/* Row container */
.row{
  display:flex;
  gap:20px;
  position:relative;
  align-items:center;
}

/* Boxes */
.box{
  width:100px;
  height:100px;
  background:#ddd;
  border-radius:10px;
}

/* Circular slider button */
.slider-btn{
  position:absolute;
  top:-60px;
  left:0;
  width:50px;
  height:50px;
  border-radius:50%;
  border:none;
  background:#4CAF50;
  color:white;
  font-size:20px;
  cursor:pointer;
  transition:left 0.5s ease, transform 0.5s linear;
}

/* Rotation animation */
.rotate{
  transform:rotate(360deg);
}
</style>

</head>
<body>

<div class="row">
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>

  <button class="slider-btn" onclick="moveSlider()">⟳</button>
</div>

<script>
let position = 0;

function moveSlider(){

  const btn = document.querySelector(".slider-btn");
  const boxes = document.querySelectorAll(".box");

  position++;
  if(position >= boxes.length){
    position = 0;
  }

  const target = boxes[position];

  btn.style.left = target.offsetLeft + "px";

  btn.classList.remove("rotate");
  void btn.offsetWidth;
  btn.classList.add("rotate");
}
</script>

</body>
</html>
